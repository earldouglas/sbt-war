name: test
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
    runs-on: '${{ matrix.os }}'
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-26.05
    - run: nix-shell --run sbt-test
